name: Xuất dữ liệu giá để phân tích

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tải giá (không ghi đè trang)
        run: |
          DUMP_DIR=/tmp/prices python scripts/build.py
      - name: Đẩy giá lên nhánh data-dump (ghi đè, không đụng main)
        run: |
          cd /tmp/prices
          git init -q -b data-dump
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Giá ngày để phân tích"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-dump
