name: Kho giá CSV

on:
  schedule:
    # 16:10 và 18:10 giờ VN, thứ Hai đến thứ Sáu (sau khi trang tín hiệu chạy xong)
    - cron: '10 9 * * 1-5'
    - cron: '10 11 * * 1-5'
  workflow_dispatch:
    inputs:
      full:
        description: 'Tải lại toàn bộ lịch sử'
        type: boolean
        default: false
  push:
    branches: [claude/project-thread-3c5f94]
    paths: ['scripts/kho_gia.py', '.github/workflows/kho-gia.yml']

permissions:
  contents: write

concurrency:
  group: kho-gia-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gia:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cập nhật kho giá
        run: python scripts/kho_gia.py ${{ inputs.full && '--full' || '' }}
      - name: Lưu vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gia
          git diff --cached --quiet && exit 0
          git commit -q -m "Kho giá phiên $(grep phien_cuoi data/gia/cap_nhat.txt | cut -d= -f2)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
